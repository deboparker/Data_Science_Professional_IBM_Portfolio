<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="140" y="20" width="320" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="300" y="48" text-anchor="middle" font-size="14" fill="#0C447C">1. Are the variables numeric?</text>
<rect x="500" y="14" width="150" height="40" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="575" y="38" text-anchor="middle" font-size="12" fill="#5F5E5A">Encode data</text>
<line x1="460" y1="40" x2="498" y2="36" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="475" y="30" text-anchor="middle" font-size="12" fill="#5F5E5A">No</text>
<line x1="300" y1="68" x2="300" y2="104" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="316" y="92" text-anchor="middle" font-size="12" fill="#5F5E5A">Yes</text>

<rect x="140" y="104" width="320" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="300" y="132" text-anchor="middle" font-size="14" fill="#0C447C">2. Are the scales similar?</text>
<rect x="500" y="98" width="150" height="40" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="575" y="122" text-anchor="middle" font-size="12" fill="#5F5E5A">Skip scaling</text>
<line x1="460" y1="124" x2="498" y2="120" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="475" y="114" text-anchor="middle" font-size="12" fill="#5F5E5A">Yes</text>
<line x1="300" y1="152" x2="300" y2="188" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="316" y="176" text-anchor="middle" font-size="12" fill="#5F5E5A">No</text>

<rect x="140" y="188" width="320" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="300" y="216" text-anchor="middle" font-size="14" fill="#085041">2a. Scale the data</text>
<line x1="300" y1="236" x2="300" y2="272" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="272" width="320" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="300" y="300" text-anchor="middle" font-size="14" fill="#0C447C">3. Visible cluster structure?</text>
<rect x="500" y="266" width="150" height="40" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="575" y="290" text-anchor="middle" font-size="12" fill="#5F5E5A">Reconsider fit</text>
<line x1="460" y1="292" x2="498" y2="288" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="475" y="282" text-anchor="middle" font-size="12" fill="#5F5E5A">No</text>
<line x1="300" y1="320" x2="300" y2="356" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="316" y="344" text-anchor="middle" font-size="12" fill="#5F5E5A">Yes</text>

<rect x="140" y="356" width="320" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="300" y="384" text-anchor="middle" font-size="14" fill="#0C447C">4. Any extreme outliers?</text>
<rect x="500" y="350" width="150" height="40" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="575" y="374" text-anchor="middle" font-size="12" fill="#5F5E5A">Use IQR rule</text>
<line x1="460" y1="376" x2="498" y2="372" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="475" y="366" text-anchor="middle" font-size="12" fill="#5F5E5A">Yes</text>
<line x1="300" y1="404" x2="300" y2="440" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="316" y="428" text-anchor="middle" font-size="12" fill="#5F5E5A">No</text>

<rect x="140" y="440" width="320" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="300" y="468" text-anchor="middle" font-size="14" fill="#0C447C">5. Too many dimensions?</text>
<line x1="300" y1="488" x2="300" y2="524" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="120" y="524" width="360" height="52" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="300" y="554" text-anchor="middle" font-size="15" fill="#173404">Suitable for K-Means</text>
</svg>
